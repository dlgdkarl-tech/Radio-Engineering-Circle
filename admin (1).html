<style>
  :root { color-scheme: dark; --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --txt:#eef0f4; --mut:#9aa3b2; --acc:#c8341f; --ok:#3aa76d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }

  main { max-width:980px; margin:0 auto; padding:16px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  button, select, input, textarea { font:inherit; color:inherit; }
  button { min-height:40px; padding:0 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); cursor:pointer; }
  button:hover { border-color:#3b4252; }
  button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.pri { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.bad { border-color:#7a2a22; color:#ff9d90; }
  button.sm { min-height:32px; padding:0 10px; font-size:13px; }
  button:disabled { opacity:.5; cursor:default; }
  input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], input[type=time], select, textarea {
    width:100%; min-height:40px; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:#0c0e12; }
  textarea { min-height:70px; resize:vertical; }
  label { display:block; font-size:13px; color:var(--mut); margin:10px 0 4px; }
  label.chk { display:flex; align-items:center; gap:8px; color:var(--txt); font-size:14px; margin:8px 0; }
  label.chk input { width:18px; height:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; min-width:140px; }
  .mut { color:var(--mut); font-size:13px; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; background:#232834; font-size:12px; color:var(--mut); }
  .pill.neo { background:#2d2a14; color:#e8c872; }
  .pill.live { background:#3a1b17; color:#ff9d90; }
  .pill.ok { background:#16301f; color:#7be0a5; }
  .list .item { display:flex; align-items:center; gap:10px; padding:9px 4px; border-top:1px solid var(--line); }
  .list .item:first-child { border-top:0; }
  .list .item .name { flex:1; cursor:pointer; min-width:0; }
  .list .item .name b { font-weight:600; }
  .list input[type=checkbox] { width:20px; height:20px; flex:none; }
  .pts { font-variant-numeric:tabular-nums; font-weight:700; min-width:44px; text-align:right; }
  .bulk { position:sticky; top:58px; z-index:4; background:#2a1512; border:1px solid #7a2a22; border-radius:12px; padding:10px; margin-bottom:12px; }
  dialog { width:min(640px,94vw); max-height:92vh; overflow:auto; border:1px solid var(--line); border-radius:16px; background:var(--card); color:var(--txt); padding:18px; }
  dialog::backdrop { background:rgba(0,0,0,.65); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; }
  @media (max-width:520px) { .grid2 { grid-template-columns:1fr; } }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-top:1px solid var(--line); }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  #toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#222733; border:1px solid var(--line); padding:10px 16px; border-radius:12px; z-index:50; display:none; max-width:90vw; }
  #toast.err { border-color:#7a2a22; color:#ff9d90; }
  .login { max-width:380px; margin:12vh auto 0; }
  h2 { font-size:16px; margin:0 0 6px; }
</style>

<script>

  vol:  [["Events", 20], ["Radio duty", 20], ["Radio duty + net control", 40], ["Radio duty + logger", 35], ["Competition", 40], ["Winning or placing (bonus)", 55]],

const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs) {
  const e = document.createElement(tag), kids = Array.prototype.slice.call(arguments, 2);
  attrs = attrs || {};
  for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false || k === "value") continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
    else if (k === "checked") e.checked = !!v;

  kids.flat(2).forEach(c => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  if (attrs.value != null) e.value = attrs.value;
  return e;
}
let toastTimer;
function toast(msg, bad) {
  const t = $("#toast"); t.textContent = msg; t.className = bad ? "err" : ""; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = "none"; }, bad ? 6000 : 2500);
}
function nowMonth() { return new Date().toLocaleDateString("en-US", { month: "long", year: "numeric", timeZone: "Asia/Manila" }); }
function manila(iso) {
  const o = {};
  new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Manila", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
    .formatToParts(new Date(iso)).forEach(p => { o[p.type] = p.value; });
  return { date: o.year + "-" + o.month + "-" + o.day, time: o.hour + ":" + o.minute };
}
function fmtEvent(e) {
  if (!e.event_at) return "Date to be announced";
  const p = manila(e.event_at);
  const d = new Date(p.date + "T00:00:00Z").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
  return d + (e.has_time ? " · " + p.time + " (Manila)" : "");

let sb = null;

    h("div", { class: "row", style: "margin-top:14px" }, h("button", { class: "pri grow", text: "Log in", onclick: go })))));

async function enter() {
  const r = await sb.rpc("is_admin");
  if (r.error || r.data !== true) {
    await sb.auth.signOut();
    return loginScreen("This account is not a moderator. Ask the admin to add your email, then log in again.");

function shell() {
  const app = $("#app"); app.replaceChildren();
  app.append(
    h("header", null, h("h1", { text: "Circle moderator" }),
      h("div", { class: "row" }, h("a", { href: "index.html", class: "mut", target: "_blank", rel: "noopener", text: "View site" }),

    h("main", null, h("div", { class: "tabs", id: "tabs" }), h("div", { id: "view" })));

}
function drawTabs() {
  const t = $("#tabs"); t.replaceChildren();
  [["members", "Members & points"], ["events", "Events"], ["reset", "Monthly reset"], ["archive", "Archive"]].forEach(([k, l]) =>
    t.append(h("button", { class: S.tab === k ? "on" : "", text: l, onclick: () => { S.tab = k; drawTabs(); drawView(); } })));
}
function drawView() {
  ({ members: viewMembers, events: viewEvents, reset: viewReset, archive: viewArchive })[S.tab]();
}

/* ---------------- data ---------------- */
async function fetchAll(table, cols, order) {
  let out = [], from = 0;
  for (;;) {
    const r = await sb.from(table).select(cols).order(order).order("id").range(from, from + 999);
    if (r.error) throw r.error;
    out = out.concat(r.data);
    if (r.data.length < 1000) return out;
    from += 1000;
  }
}
async function refresh() {
  try {
    const [m, a, e, ar] = await Promise.all([
      fetchAll("members", "id,name,neophyte,band", "name"),
      fetchAll("activity", "id,member_id,label,category,pts,note,created_at", "created_at"),
      sb.from("events").select("*").order("sort").order("id"),
      sb.from("archive").select("id,month,created_at,snapshot").order("created_at", { ascending: false })
    ]);
    if (e.error) throw e.error; if (ar.error) throw ar.error;
    S.members = m; S.acts = a; S.events = e.data; S.archive = ar.data;
    const ids = new Set(m.map(x => x.id)); S.sel.forEach(id => { if (!ids.has(id)) S.sel.delete(id); });
  } catch (err) { toast("Could not load data: " + (err.message || err), true); }
  drawView();
  const open = document.querySelector("dialog[data-member]");
  if (open) { const id = Number(open.dataset.member); open.close(); if (S.members.some(x => x.id === id)) openMember(id); }
}
async function run(promise, okMsg) {
  const r = await promise;
  if (r && r.error) { toast(r.error.message, true); return false; }
  if (okMsg) toast(okMsg);

}
function totals(id) {
  const t = { att: 0, vol: 0, con: 0, misc: 0, tot: 0, list: [] };
  S.acts.forEach(a => { if (a.member_id === id) { t[a.category] += a.pts; t.tot += a.pts; t.list.push(a); } });
  return t;
}
function allBands() {
  const set = new Set(BASE_BANDS);
  S.members.forEach(m => (m.band ? m.band.split(", ") : []).forEach(b => set.add(b)));
  return Array.from(set).sort();
}
const bandStr = arr => arr.join(", ");

/* ---------------- members tab ---------------- */
function viewMembers() {
  const v = $("#view"); v.replaceChildren();
  const search = h("input", { type: "text", placeholder: "Search name or band", value: S.q });
  search.addEventListener("input", () => { S.q = search.value; drawList(); });
  const filters = h("div", { class: "row", id: "filters" });
  v.append(
    h("div", { class: "card" },
      h("div", { class: "row" }, h("div", { class: "grow" }, search),
        h("button", { class: "pri", text: "+ Add member", onclick: openNewMember })),
      h("div", { style: "margin-top:10px" }, filters)),
    h("div", { id: "bulk" }), h("div", { class: "card list", id: "list" }));
  const FL = [["all", "All"], ["points", "With points"], ["neo", "Neophytes"], ["noband", "No band"]];
  FL.forEach(([k, l]) => filters.append(h("button", { class: "sm " + (S.filter === k ? "on" : ""), text: l,
    onclick: () => { S.filter = k; viewMembers(); } })));
  drawList();
}
function drawBulk() {
  const b = $("#bulk"); if (!b) return; b.replaceChildren();
  if (!S.sel.size) return;
  b.append(h("div", { class: "bulk row" }, h("b", { text: S.sel.size + " selected" }), h("span", { class: "grow" }),
    h("button", { class: "pri sm", text: "Add points…", onclick: () => openBulkPoints() }),
    h("button", { class: "sm", text: "Assign band…", onclick: () => openBulkBand() }),
    h("button", { class: "sm", text: "Clear", onclick: () => { S.sel.clear(); drawList(); } })));
}
function drawList() {
  const box = $("#list"); if (!box) return; box.replaceChildren();
  const q = S.q.trim().toLowerCase();
  const rows = S.members.map(m => ({ m, t: totals(m.id) })).filter(({ m, t }) => {
    if (q && !(m.name + " " + m.band).toLowerCase().includes(q)) return false;
    if (S.filter === "points") return t.tot !== 0;
    if (S.filter === "neo") return m.neophyte;
    if (S.filter === "noband") return !m.band;
    return true;
  });
  if (!rows.length) box.append(h("p", { class: "mut", text: "No members match." }));
  rows.forEach(({ m, t }) => {
    const cb = h("input", { type: "checkbox", checked: S.sel.has(m.id), "aria-label": "Select " + m.name });
    cb.addEventListener("change", () => { cb.checked ? S.sel.add(m.id) : S.sel.delete(m.id); drawBulk(); });
    box.append(h("div", { class: "item" }, cb,
      h("div", { class: "name", onclick: () => openMember(m.id) }, h("b", { text: m.name }), " ",

        h("div", { class: "mut", text: m.band || "No band yet" })),
      h("div", { class: "pts", text: t.tot })));
  });

function bandChecks(current) {
  const boxes = allBands().map(b => h("label", { class: "chk" }, h("input", { type: "checkbox", value: b, checked: current.includes(b) }), b));
  const extra = h("input", { type: "text", placeholder: "Another band (optional)" });
  const wrap = h("div", null, h("div", { class: "grid2" }, boxes), h("label", { text: "New band name" }), extra);
  wrap.read = () => {
    const picked = boxes.map(l => l.firstChild).filter(i => i.checked).map(i => i.value);
    const x = extra.value.trim().toUpperCase(); if (x && !picked.includes(x)) picked.push(x);
    return picked;
  };
  wrap.onPick = fn => boxes.forEach(l => l.firstChild.addEventListener("change", fn));
  return wrap;
}

function dialog(attrs, ...kids) {
  const d = h("dialog", attrs, ...kids);
  d.addEventListener("close", () => d.remove());
  document.body.append(d); d.showModal(); return d;
}
const closeBtn = d => h("button", { class: "sm", text: "Close", onclick: () => d.close() });

function openMember(id) {

  const t = totals(id);
  const name = h("input", { type: "text", value: m.name });

  const d = dialog({ "data-member": String(id) });
  const acts = t.list.length

          h("div", { class: "grow" }, h("b", { text: a.label }), h("div", { class: "mut", text: CATNAME[a.category] + " · " + new Date(a.created_at).toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "Asia/Manila" }) })),
          pts,
          h("button", { class: "sm", text: "Save", onclick: async () => { const n = parseInt(pts.value, 10); if (isNaN(n)) return toast("Enter a number", true); if (await run(sb.from("activity").update({ pts: n }).eq("id", a.id), "Points updated")) refresh(); } }),
          h("button", { class: "sm bad", text: "Delete", onclick: async () => { if (confirm("Delete this entry?") && await run(sb.from("activity").delete().eq("id", a.id), "Entry deleted")) refresh(); } }));
      })
    : [h("p", { class: "mut", text: "No points this month." })];

    h("div", { class: "row" }, h("h2", { class: "grow", text: m.name }), closeBtn(d)),
    h("div", { class: "row", style: "margin:6px 0 10px" },
      ["att", "vol", "con", "misc"].map(k => h("span", { class: "pill", text: CATNAME[k] + " " + t[k] })), h("span", { class: "pill ok", text: "Total " + t.tot })),
    h("h2", { text: "Points", style: "margin-top:14px" }), h("div", null, acts),
    h("h2", { text: "Add points", style: "margin-top:16px" }), pointsForm(() => [id], () => refresh()),
    h("h2", { text: "Band and details", style: "margin-top:20px" }),
    h("label", { text: "Name" }), name,
    h("label", { class: "chk" }, neo, "Neophyte (uncheck once they get their band)"),
    h("div", { class: "mut", text: "Band(s):" }), bc,
    h("div", { class: "row", style: "margin-top:12px" },
      h("button", { class: "pri", text: "Save band and details", onclick: async () => {
        const nm = name.value.trim(); if (!nm) return toast("Name can't be empty", true);
        if (await run(sb.from("members").update({ name: nm, neophyte: neo.checked, band: bandStr(bc.read()) }).eq("id", id), "Saved")) refresh();
      } }),
      h("span", { class: "grow" }),
      h("button", { class: "bad", text: "Delete member", onclick: async () => {
        if (confirm("Delete " + m.name + " and all their points? This can't be undone.") && await run(sb.from("members").delete().eq("id", id), "Member deleted")) { d.close(); refresh(); }
      } })));
}

function pointsForm(getIds, done) {
  const cat = h("select", null, Object.keys(CATNAME).map(k => h("option", { value: k, text: CATNAME[k] })));
  const act = h("select");
  const label = h("input", { type: "text", placeholder: "What for (e.g. Net control)" });

    if (act.value === "custom") { label.value = ""; pts.value = ""; return; }
    const [n, p] = RULES[cat.value][Number(act.value)]; label.value = n; pts.value = p;
  };
  cat.addEventListener("change", fill); act.addEventListener("change", pick); fill();

    h("div", { class: "grid2" }, h("div", null, h("label", { text: "Category" }), cat), h("div", null, h("label", { text: "Activity" }), act)),
    h("div", { class: "grid2" }, h("div", null, h("label", { text: "Label shown on the site" }), label), h("div", null, h("label", { text: "Points (half day = half; negative to correct)" }), pts)),

    } })));
}

async function setStatus(e, st) { if (await run(sb.from("events").update({ status: st }).eq("id", e.id), "Moved to " + st)) refresh(); }

  const month = h("input", { type: "text", value: nowMonth() });

  const btn = h("button", { class: "bad", text: "Save to archive and reset points", disabled: true });
  word.addEventListener("input", () => { btn.disabled = word.value.trim() !== "RESET"; });
  btn.addEventListener("click", async () => {

function downloadCsv(a) {
