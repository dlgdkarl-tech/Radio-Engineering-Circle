<script>
(function () {
  var CAT = { att: "Attending", vol: "Volunteering", con: "Consistency", misc: "Miscellaneous" };

  // BEGIN buildLB
  function titleBand(b) {
    var small = { and: 1, of: 1, the: 1 }, keep = { QSL: 1, "&": 1 };
    return String(b).toLowerCase().split(" ").map(function (w, i) {
      var up = w.toUpperCase();
      if (keep[up]) return up;
      if (i > 0 && small[w]) return w;
      return w.charAt(0).toUpperCase() + w.slice(1);
    }).join(" ");
  }
  function buildLB(members, acts) {
    var by = {};
    members.forEach(function (m) {
      by[m.id] = { n: m.name, neo: !!m.neophyte, band: m.band || "", rank: null, att: 0, vol: 0, con: 0, misc: 0, tot: 0, codes: [] };
    });
    acts.forEach(function (a) {
      var m = by[a.member_id];
      if (!m || !CAT[a.category]) return;
      m[a.category] += a.pts; m.tot += a.pts; m.codes.push([a.label, a.pts, CAT[a.category]]);
    });
    var list = Object.keys(by).map(function (k) { return by[k]; }).sort(function (a, b) { return a.n.localeCompare(b.n); });
    var scores = Array.from(new Set(list.filter(function (m) { return m.tot > 0; }).map(function (m) { return m.tot; }))).sort(function (a, b) { return b - a; });
    list.forEach(function (m) { if (m.tot > 0) m.rank = scores.indexOf(m.tot) + 1; });
    var top5 = scores.slice(0, 5).map(function (p, i) {
      return { rank: i + 1, names: list.filter(function (m) { return m.tot === p; }).map(function (m) { return m.n; }), pts: p };
    });
    function best(key, pred, title, noteYes, noteNo) {
      var pool = list.filter(function (m) { return m[key] > 0 && (!pred || pred(m)); });
      var max = pool.reduce(function (a, m) { return Math.max(a, m[key]); }, 0);
      var who = pool.filter(function (m) { return m[key] === max; }).map(function (m) { return m.n; });
      return { t: title, who: who, note: who.length ? noteYes : noteNo, pts: who.length ? max : null };
    }
    var bandTot = {}, bandMembers = {};
    list.forEach(function (m) {
      var bs = m.band ? m.band.split(", ") : [];
      bs.forEach(function (b) {
        bandTot[b] = (bandTot[b] || 0) + m.tot / bs.length;
        (bandMembers[b] = bandMembers[b] || []).push(m);
      });
    });
    var bmax = Object.keys(bandTot).reduce(function (a, b) { return Math.max(a, bandTot[b]); }, 0);
    var topBands = bmax > 0 ? Object.keys(bandTot).filter(function (b) { return bandTot[b] === bmax; }).sort() : [];
    var contributors = [];
    topBands.forEach(function (b) {
      var mx = bandMembers[b].reduce(function (a, m) { return Math.max(a, m.tot); }, 0);
      bandMembers[b].filter(function (m) { return m.tot === mx; }).forEach(function (m) { contributors.push(m.n); });
    });
    var awards = [
      best("att", null, "Active Participation", "Top attending points", "Attending points not awarded yet"),
      best("vol", null, "Service Excellence", "Top volunteering points", "Volunteering points not awarded yet"),
      { t: "Outstanding Band", who: topBands.map(titleBand), note: topBands.length ? "Top contributors: " + contributors.join("; ") : "No band has scored yet", pts: null },
      best("tot", function (m) { return m.neo; }, "Distinguished Neophytes", "Top neophyte points", "No neophyte has scored yet"),
      best("con", null, "Reliable Ka-Circle", "Top consistency points", "Consistency points not awarded yet"),
      best("misc", null, "Technical Achievement", "Top miscellaneous points", "Miscellaneous points not awarded yet")
    ];
    return { asOf: new Date().toLocaleDateString("en-US", { month: "long", year: "numeric" }), top5: top5, awards: awards, members: list };
  }
  // END buildLB

  function mapEvents(rows) {
    var sorted = rows.slice().sort(function (a, b) { return (a.sort - b.sort) || (a.id - b.id); });
    var shown = sorted.filter(function (e) { return e.status !== "next"; });
    shown.sort(function (a, b) {
      return (Number(!!b.featured) - Number(!!a.featured)) || (Number(b.status === "ongoing") - Number(a.status === "ongoing"));
    });
    return {
      done: shown.map(function (e) { return { t: e.title, k: e.kind || "Event", d: e.description || "", big: !!e.featured, live: e.status === "ongoing" }; }),
      next: sorted.filter(function (e) { return e.status === "next"; }).map(function (e) {
        return { title: e.title, date: e.event_at || null, hasTime: !!e.has_time, note: e.note || "" };
      })
    };
  }

  function page(path) {
    var c = window.SITE_CONFIG || {};
    if (!c.SUPABASE_URL || /PASTE_/.test(c.SUPABASE_URL) || !c.SUPABASE_KEY || /PASTE_/.test(c.SUPABASE_KEY)) return Promise.reject(new Error("not configured"));

        .then(function (r) { clearTimeout(timer); if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (rows) { out = out.concat(rows); return rows.length === 1000 ? next(from + 1000) : out; });
    }
    return next(0);
  }

  function run() {
    var s = document.createElement("script");
    s.textContent = document.getElementById("app-src").textContent;
    document.body.appendChild(s);
  }

  function apply(d) {
    var lb = buildLB(d.members, d.acts), ev = mapEvents(d.events);

  }

  if (window.__CIRCLE_TEST_BUILD) { window.__buildLB = buildLB; window.__mapEvents = mapEvents; return; }

  Promise.all([
    page("members?select=id,name,neophyte,band&order=name"),
    page("activity?select=member_id,label,category,pts&order=created_at,id"),

  }).catch(function () {
    try { return JSON.parse(localStorage.getItem("circle-live-v1")); } catch (e) { return null; }
  }).then(function (d) {
    if (d) { try { apply(d); } catch (e) { console.error("Live data failed, using built-in snapshot", e); } }
    run();
  });
})();
