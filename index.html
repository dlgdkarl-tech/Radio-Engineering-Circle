    return {
      done: shown.map(function (e) { return { t: e.title, k: e.kind || "Event", d: e.description || "", big: !!e.featured, live: e.status === "ongoing" }; }),
      next: sorted.filter(function (e) { return e.status === "next"; }).map(function (e) {
        return { title: e.title, date: e.event_at || null, hasTime: !!e.has_time, note: e.note || "" };
      })
    };
  }

  function page(path) {
    var c = window.SITE_CONFIG || {};
    if (!c.SUPABASE_URL || /PASTE_/.test(c.SUPABASE_URL) || !c.SUPABASE_KEY || /PASTE_/.test(c.SUPABASE_KEY)) return Promise.reject(new Error("not configured"));
    var base = c.SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/" + path, out = [];
    function next(from) {
      var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, 4000);
      return fetch(base, { headers: { apikey: c.SUPABASE_KEY, Range: from + "-" + (from + 999) }, cache: "no-store", signal: ctl.signal })
        .then(function (r) { clearTimeout(timer); if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (rows) { out = out.concat(rows); return rows.length === 1000 ? next(from + 1000) : out; });
    }
    return next(0);
  }

  function run() {
    var s = document.createElement("script");
    s.textContent = document.getElementById("app-src").textContent;
    document.body.appendChild(s);
  }

  function apply(d) {
    var lb = buildLB(d.members, d.acts), ev = mapEvents(d.events);
    window.LB = lb; window.LIVE_DONE = ev.done; window.LIVE_NEXT = ev.next;
  }

  if (window.__CIRCLE_TEST_BUILD) { window.__buildLB = buildLB; window.__mapEvents = mapEvents; return; }

  function readCache() { try { return JSON.parse(localStorage.getItem("circle-live-v1")); } catch (e) { return null; } }
  function load() {
    return Promise.all([
      page("members?select=id,name,neophyte,band&order=name"),
      page("activity?select=member_id,label,category,pts&order=created_at,id"),
      page("events?select=*&order=sort,id")
    ]).then(function (r) {
      var d = { members: r[0], acts: r[1], events: r[2] };
      try { localStorage.setItem("circle-live-v1", JSON.stringify(d)); } catch (e) {}
      return d;
    });
  }
  // Instant start: if we already have data from a previous visit, show it now and refresh it quietly for next time.
  var cached = readCache();
  if (cached) {
    try { apply(cached); } catch (e) { console.error("Cached data failed, using built-in snapshot", e); }
    run();
    load().catch(function () {});
  } else {
    load().catch(function () { return null; }).then(function (d) {
      if (d) { try { apply(d); } catch (e) { console.error("Live data failed, using built-in snapshot", e); } }
      run();
    });
  }
})();
</script>
</body></html>
